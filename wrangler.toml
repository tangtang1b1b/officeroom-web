name = "officeroom"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[vars]
# 部署前填入 Vercel 正式網址,逗號分隔,例如 "https://xxx.vercel.app"
ALLOWED_ORIGINS = "https://officeroom-web.vercel.app"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 免費方案只支援 SQLite 型 Durable Object,因此用 new_sqlite_classes
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
