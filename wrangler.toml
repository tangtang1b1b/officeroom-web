name = "officeroom"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[vars]
# 部署前填入 Vercel 正式網址,逗號分隔,例如 "https://xxx.vercel.app"
ALLOWED_ORIGINS = "https://officeroom-web.vercel.app"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 免費方案只支援 SQLite 型 Durable Object,因此用 new_sqlite_classes
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 每 10 分鐘抓一次 ClickUp 卡片數,台灣時間 08:00 ~ 20:00(Cron 用 UTC:00:00 ~ 12:00)。
# token 用 `npx wrangler secret put CLICKUP_TOKEN` 設定,不要寫在這個檔案。
[triggers]
crons = ["*/10 0-11 * * *", "0 12 * * *"]
